[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dotmatics-api"
version = "2.0.0"
description = "Python clients for the Dotmatics Browser and Inventory REST APIs"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = ["requests>=2.32", "urllib3>=2,<3"]
classifiers = ["Private :: Do Not Upload", "Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.urls]
Homepage = "https://github.com/kimiatx-oss/dotmatics-api"
Issues = "https://github.com/kimiatx-oss/dotmatics-api/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.11"]
proxy = ["pysocks>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "examples/sqlite_mirror/tests"]
addopts = "--strict-markers"
markers = ["integration: explicitly selected live tests", "transport: controlled loopback transport tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
