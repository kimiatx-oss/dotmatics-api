name: Tests and release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,proxy]'
      - run: python -m pytest
      - run: ruff check . && ruff format --check .
      - run: python scripts/check_release.py
      - run: python -m build
      - run: python scripts/check_release.py dist/*.whl dist/*.tar.gz
      - name: Install wheel outside the source checkout
        shell: bash
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install dist/*.whl pytest pysocks
          cd /tmp
          /tmp/wheel-test/bin/python -m pytest "$GITHUB_WORKSPACE/tests/unit" --import-mode=importlib
      - name: Install sdist outside the source checkout
        shell: bash
        run: |
          python -m venv /tmp/sdist-test
          /tmp/sdist-test/bin/pip install dist/*.tar.gz pytest pysocks
          cd /tmp
          /tmp/sdist-test/bin/python -m pytest "$GITHUB_WORKSPACE/tests/unit" --import-mode=importlib
